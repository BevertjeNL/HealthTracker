name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/healthtracker
      STRAVA_CLIENT_ID: ci-client
      STRAVA_CLIENT_SECRET: ci-secret
      CRON_SECRET: ci-cron-secret
      HEALTH_INGEST_SECRET: ci-ingest-secret
      APP_PASSWORD: ci-password-is-long-enough
      SESSION_SECRET: ci-session-secret-is-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
