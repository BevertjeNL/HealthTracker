name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/healthtracker
      STRAVA_CLIENT_ID: ci-client
      STRAVA_CLIENT_SECRET: ci-secret
      CRON_SECRET: ci-cron-secret
      HEALTH_INGEST_SECRET: ci-ingest-secret
      APP_PASSWORD: ci-password-is-long-enough
      SESSION_SECRET: ci-session-secret-is-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
